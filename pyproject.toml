[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-age-judy8585"
version = "0.1.0"
description = "A Python package for visualizing tennis players' career matches"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "matplotlib",
    "requests"
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
